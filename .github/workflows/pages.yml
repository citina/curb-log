name: deploy page

# The site deploys from here rather than from GitHub's automatic branch build,
# so only a change under docs/ publishes it. CI commits a poll every 5 minutes,
# and under the branch build each of those rebuilt the site, past Pages' soft
# limit of 10 builds an hour.
on:
  push:
    branches: [main]
    paths: ["docs/**"]
  # poll.yml and archive.yml start this after they change docs/data.json:
  # pushes made with GITHUB_TOKEN don't trigger on: push.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry1.outputs.page_url || steps.retry2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      # The deploy starts about 1.5 s after the upload, and GitHub often can't
      # see the artifact yet: "Fetching artifact metadata failed", "No artifacts
      # named github-pages were found", "Deployment failed, try again later".
      # 30 of 84 deploys failed that way from 19 to 26 Nov. Waiting and trying
      # again clears it, so try three times; the run fails only if all three do.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before trying again
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - id: retry1
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before the last try
        if: steps.deployment.outcome == 'failure' && steps.retry1.outcome == 'failure'
        run: sleep 60

      - id: retry2
        if: steps.deployment.outcome == 'failure' && steps.retry1.outcome == 'failure'
        uses: actions/deploy-pages@v4

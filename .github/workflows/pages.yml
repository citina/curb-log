name: deploy page

# The site deploys from here rather than from GitHub's automatic branch build,
# so only a change under docs/ publishes it. CI commits a poll every 5 minutes,
# and under the branch build each of those rebuilt the site, past Pages' soft
# limit of 10 builds an hour.
on:
  push:
    branches: [main]
    paths: ["docs/**"]
  # poll.yml and archive.yml start this after they change docs/data.json:
  # pushes made with GITHUB_TOKEN don't trigger on: push.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4

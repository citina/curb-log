name: poll parking occupancy

# Every 5 minutes. GitHub does not guarantee punctuality for scheduled
# workflows and will drop runs under load, so treat this as best-effort
# coverage — patterns.py reports polls-per-cell precisely because of that.
on:
  schedule:
    # 8am-6pm Los Angeles, Mon-Fri. The UTC range covers both PDT and PST;
    # poll_live.py does the exact local-time gate.
    - cron: "*/5 14-23,0-1 * * 1-6"
  workflow_dispatch:

# Never let two runs push at once.
concurrency:
  group: poll
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Poll LADOT
        working-directory: tools
        run: python3 poll_live.py --ids sensored_ids.txt --data-dir data --collector ci --only-hours 8-17 --only-weekdays

      - name: Refresh the page's aggregate
        working-directory: tools
        # The archive half is precomputed locally and cached in
        # archive_cells.json, so CI never needs the 200MB monthly extracts.
        run: python3 build_data.py --out ../docs/data.json

      - name: Commit the snapshot
        run: |
          git config user.name  "curb-log bot"
          git config user.email "noreply@github.com"
          git add tools/data/ci docs/data.json
          if git diff --cached --quiet; then
            echo "nothing new"; exit 0
          fi
          git commit -m "poll $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Another run may have pushed while we worked; rebase and retry.
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((RANDOM % 10 + 5))
          done
          echo "could not push after 3 attempts"; exit 1

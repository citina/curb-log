name: poll parking occupancy

# Every 5 minutes. GitHub does not guarantee punctuality for scheduled
# workflows and will drop runs under load, so treat this as best-effort
# coverage — patterns.py reports polls-per-cell precisely because of that.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

# Never let two runs push at once.
concurrency:
  group: poll
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Poll LADOT
        working-directory: tools
        run: python3 poll_live.py --ids sensored_ids.txt --data-dir data

      - name: Commit the snapshot
        run: |
          git config user.name  "curb-log bot"
          git config user.email "noreply@github.com"
          git add tools/data
          if git diff --cached --quiet; then
            echo "nothing new"; exit 0
          fi
          git commit -m "poll $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Another run may have pushed while we worked; rebase and retry.
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((RANDOM % 10 + 5))
          done
          echo "could not push after 3 attempts"; exit 1

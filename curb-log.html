<title>Curb Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
  :root {
    color-scheme: light;
    --plane:      #f2f2ef;
    --surface:    #fcfcfb;
    --well:       #e8e8e2;
    --ink:        #14140f;
    --ink-2:      #56554f;
    --ink-3:      #8a8880;
    --rule:       #e1e0d9;
    --edge:       #c9c8c0;
    --accent:     #2a78d6;
    --accent-ink: #1c5cab;
    --accent-wash:#e8f1fd;
    --panel:      #1a1a19;
    --panel-ink:  #fcfcfb;
    --panel-ink-2:#b6b5ab;
    --good:       #0ca30c;
    --critical:   #d03b3b;

    /* Scarcity ramp: dark = few spots free (far from surface = the problem) */
    --heat-0: #0d366b; --heat-0-ink: #ffffff;   /* 0 free */
    --heat-1: #1c5cab; --heat-1-ink: #ffffff;
    --heat-2: #2a78d6; --heat-2-ink: #ffffff;
    --heat-3: #6da7ec; --heat-3-ink: #0b0b0b;
    --heat-4: #9ec5f4; --heat-4-ink: #0b0b0b;
    --heat-5: #cde2fb; --heat-5-ink: #0b0b0b;   /* 5+ free */

    /* Coverage ramp: neutral, more data = more filled */
    --cov-1: #dedcd4; --cov-1-ink: #56554f;
    --cov-2: #bebbaf; --cov-2-ink: #14140f;
    --cov-3: #8a8880; --cov-3-ink: #ffffff;
    --cov-4: #56554f; --cov-4-ink: #ffffff;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --plane:      #0d0d0d;
      --surface:    #1a1a19;
      --well:       #232322;
      --ink:        #ffffff;
      --ink-2:      #c3c2b7;
      --ink-3:      #898781;
      --rule:       #2c2c2a;
      --edge:       #383835;
      --accent:     #3987e5;
      --accent-ink: #86b6ef;
      --accent-wash:#16243a;
      --panel:      #262625;
      --panel-ink:  #ffffff;
      --panel-ink-2:#a9a89e;
      --good:       #0ca30c;
      --critical:   #e66767;

      --heat-0: #cde2fb; --heat-0-ink: #0b0b0b;
      --heat-1: #9ec5f4; --heat-1-ink: #0b0b0b;
      --heat-2: #6da7ec; --heat-2-ink: #0b0b0b;
      --heat-3: #3987e5; --heat-3-ink: #ffffff;
      --heat-4: #256abf; --heat-4-ink: #ffffff;
      --heat-5: #184f95; --heat-5-ink: #ffffff;

      --cov-1: #2f2f2d; --cov-1-ink: #a9a89e;
      --cov-2: #4a4945; --cov-2-ink: #ffffff;
      --cov-3: #6e6c65; --cov-3-ink: #ffffff;
      --cov-4: #98968d; --cov-4-ink: #0b0b0b;
    }
  }

  :root[data-theme="dark"] {
    color-scheme: dark;
    --plane:      #0d0d0d;
    --surface:    #1a1a19;
    --well:       #232322;
    --ink:        #ffffff;
    --ink-2:      #c3c2b7;
    --ink-3:      #898781;
    --rule:       #2c2c2a;
    --edge:       #383835;
    --accent:     #3987e5;
    --accent-ink: #86b6ef;
    --accent-wash:#16243a;
    --panel:      #262625;
    --panel-ink:  #ffffff;
    --panel-ink-2:#a9a89e;
    --good:       #0ca30c;
    --critical:   #e66767;

    --heat-0: #cde2fb; --heat-0-ink: #0b0b0b;
    --heat-1: #9ec5f4; --heat-1-ink: #0b0b0b;
    --heat-2: #6da7ec; --heat-2-ink: #0b0b0b;
    --heat-3: #3987e5; --heat-3-ink: #ffffff;
    --heat-4: #256abf; --heat-4-ink: #ffffff;
    --heat-5: #184f95; --heat-5-ink: #ffffff;

    --cov-1: #2f2f2d; --cov-1-ink: #a9a89e;
    --cov-2: #4a4945; --cov-2-ink: #ffffff;
    --cov-3: #6e6c65; --cov-3-ink: #ffffff;
    --cov-4: #98968d; --cov-4-ink: #0b0b0b;
  }

  * { box-sizing: border-box; }

  body {
    background: var(--plane);
    color: var(--ink);
    font-family: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 15px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 760px; margin-inline: auto; padding: 0 14px 96px; }

  /* ---------- masthead ---------- */
  .masthead {
    display: flex; align-items: baseline; gap: 10px;
    padding: 20px 2px 12px;
  }
  .masthead h1 {
    margin: 0; font-size: 21px; font-weight: 700;
    letter-spacing: -0.01em;
  }
  .masthead .sub {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 11px; color: var(--ink-3);
    text-transform: uppercase; letter-spacing: 0.08em;
  }

  /* ---------- nav ---------- */
  .nav {
    position: sticky; top: 0; z-index: 20;
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 2px; padding: 6px; margin-bottom: 16px;
    background: var(--well); border-radius: 10px;
    box-shadow: 0 6px 18px -12px rgba(0,0,0,.5);
  }
  .nav button {
    appearance: none; border: 0; cursor: pointer;
    background: transparent; color: var(--ink-2);
    font-family: inherit; font-size: 14px; font-weight: 600;
    padding: 9px 4px; border-radius: 7px;
    min-height: 40px;
  }
  .nav button[aria-selected="true"] {
    background: var(--surface); color: var(--ink);
    box-shadow: 0 1px 2px rgba(0,0,0,.10);
  }

  /* ---------- generic blocks ---------- */
  .card {
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .card > h2 {
    margin: 0 0 3px; font-size: 15px; font-weight: 600;
    letter-spacing: -0.005em;
  }
  .card > .hint {
    margin: 0 0 14px; font-size: 13px; color: var(--ink-2);
    max-width: 62ch;
  }
  .eyebrow {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 10px; font-weight: 500; color: var(--ink-3);
    text-transform: uppercase; letter-spacing: 0.1em;
    margin: 0 0 8px;
  }

  .banner {
    display: flex; gap: 10px; align-items: flex-start;
    background: var(--accent-wash);
    border: 1px solid color-mix(in srgb, var(--accent) 28%, transparent);
    border-radius: 10px; padding: 11px 13px; margin-bottom: 14px;
    font-size: 13px; color: var(--ink);
  }
  .banner strong { font-weight: 600; }
  .banner .dot {
    flex: none; width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent); margin-top: 6px;
  }

  /* ---------- tap rows ---------- */
  .field { margin-bottom: 18px; }
  .field:last-child { margin-bottom: 0; }
  .label {
    display: flex; justify-content: space-between; align-items: baseline;
    gap: 8px; margin-bottom: 7px;
  }
  .label .name {
    font-size: 13px; font-weight: 600; color: var(--ink);
  }
  .label .aside {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 11px; color: var(--ink-3);
  }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    appearance: none; cursor: pointer;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 13px; font-weight: 500;
    min-height: 44px; min-width: 46px; padding: 0 12px;
    background: var(--surface); color: var(--ink-2);
    border: 1px solid var(--edge); border-radius: 9px;
  }
  .chip:hover { border-color: var(--ink-3); }
  .chip[aria-pressed="true"] {
    background: var(--accent); border-color: var(--accent);
    color: #ffffff; font-weight: 600;
  }
  .chip.wide { font-family: "Barlow", sans-serif; font-size: 14px; }
  .chip.ghost { border-style: dashed; color: var(--ink-3); }

  .grid-chips { display: grid; grid-template-columns: repeat(auto-fit, minmax(46px, 1fr)); gap: 6px; }

  /* ---------- inputs ---------- */
  input[type="text"], input[type="number"], input[type="datetime-local"], textarea {
    width: 100%; font-family: inherit; font-size: 15px;
    background: var(--surface); color: var(--ink);
    border: 1px solid var(--edge); border-radius: 9px;
    padding: 10px 11px; min-height: 44px;
  }
  textarea { min-height: 66px; resize: vertical; line-height: 1.4; }
  input:focus-visible, textarea:focus-visible, button:focus-visible, .cell:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }

  .btn {
    appearance: none; cursor: pointer; font-family: inherit;
    font-size: 15px; font-weight: 600; min-height: 48px;
    padding: 0 18px; border-radius: 10px;
    background: var(--accent); color: #ffffff; border: 1px solid var(--accent);
    width: 100%;
  }
  .btn:hover { background: var(--accent-ink); border-color: var(--accent-ink); }
  .btn.secondary {
    background: var(--surface); color: var(--ink);
    border-color: var(--edge); font-weight: 500;
  }
  .btn.secondary:hover { background: var(--well); border-color: var(--ink-3); }
  .btn.small { min-height: 38px; font-size: 13px; width: auto; padding: 0 13px; }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }

  .linkish {
    appearance: none; background: none; border: 0; cursor: pointer;
    font-family: inherit; font-size: 13px; font-weight: 500;
    color: var(--accent-ink); padding: 4px 0; text-decoration: underline;
    text-underline-offset: 3px;
  }

  /* ---------- receipt / confirmation ---------- */
  .receipt {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    background: var(--well); border-radius: 10px;
    padding: 11px 13px; margin-bottom: 14px;
    font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12.5px;
    color: var(--ink);
  }
  .receipt .tick { color: var(--good); font-weight: 600; }

  /* ---------- verdict panel (the one bold element) ---------- */
  .verdict {
    background: var(--panel); color: var(--panel-ink);
    border-radius: 12px; padding: 20px 18px; margin-bottom: 14px;
  }
  .verdict .when {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--panel-ink-2); margin-bottom: 10px;
  }
  .verdict .headline {
    font-size: 30px; font-weight: 700; line-height: 1.1;
    letter-spacing: -0.02em; margin-bottom: 8px; text-wrap: balance;
  }
  .verdict .headline .num { font-variant-numeric: proportional-nums; }
  .verdict .basis { font-size: 13px; color: var(--panel-ink-2); max-width: 54ch; }

  .stats {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(104px, 1fr));
    gap: 1px; background: var(--rule);
    border: 1px solid var(--rule); border-radius: 12px; overflow: hidden;
    margin-bottom: 14px;
  }
  .stat { background: var(--surface); padding: 12px 13px; }
  .stat .v {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 20px; font-weight: 600; letter-spacing: -0.01em;
  }
  .stat .k { font-size: 11.5px; color: var(--ink-2); margin-top: 1px; }

  /* ---------- heat grid ---------- */
  .grid-scroll { overflow-x: auto; padding-bottom: 4px; }
  .heat {
    display: grid; gap: 2px; min-width: 470px;
  }
  .heat .hcol, .heat .hrow {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 10.5px; color: var(--ink-3);
    display: flex; align-items: center;
  }
  .heat .hcol { justify-content: center; padding-bottom: 3px; }
  .heat .hrow { justify-content: flex-start; padding-right: 6px; letter-spacing: 0.04em; }
  .cell {
    appearance: none; border: 0; cursor: pointer; padding: 0;
    height: 30px; border-radius: 3px;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 11px; font-weight: 500;
    display: flex; align-items: center; justify-content: center;
    background: transparent; color: var(--ink-3);
  }
  .cell.empty {
    border: 1px dashed var(--edge); color: var(--ink-3);
    font-size: 12px; cursor: default;
  }
  .cell.now { box-shadow: 0 0 0 2px var(--ink); }
  .cell.h0 { background: var(--heat-0); color: var(--heat-0-ink); }
  .cell.h1 { background: var(--heat-1); color: var(--heat-1-ink); }
  .cell.h2 { background: var(--heat-2); color: var(--heat-2-ink); }
  .cell.h3 { background: var(--heat-3); color: var(--heat-3-ink); }
  .cell.h4 { background: var(--heat-4); color: var(--heat-4-ink); }
  .cell.h5 { background: var(--heat-5); color: var(--heat-5-ink); }
  .cell.c1 { background: var(--cov-1); color: var(--cov-1-ink); }
  .cell.c2 { background: var(--cov-2); color: var(--cov-2-ink); }
  .cell.c3 { background: var(--cov-3); color: var(--cov-3-ink); }
  .cell.c4 { background: var(--cov-4); color: var(--cov-4-ink); }

  .legend {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    margin-top: 12px;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 10.5px; color: var(--ink-2);
  }
  .legend .swatches { display: flex; gap: 2px; }
  .legend .sw { width: 26px; height: 13px; border-radius: 2px; }

  .cell-detail {
    margin-top: 12px; padding: 11px 13px;
    background: var(--well); border-radius: 9px;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 12px; color: var(--ink); line-height: 1.55;
  }
  .cell-detail .muted { color: var(--ink-2); }

  /* ---------- chart ---------- */
  .chart-wrap { position: relative; }
  .chart-wrap svg { display: block; width: 100%; height: auto; overflow: visible; }
  .tip {
    position: absolute; pointer-events: none;
    background: var(--panel); color: var(--panel-ink);
    border-radius: 7px; padding: 7px 9px;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 11px; line-height: 1.5; white-space: nowrap;
    box-shadow: 0 8px 20px -10px rgba(0,0,0,.7);
    transform: translate(-50%, -112%);
    opacity: 0; transition: opacity .1s;
  }
  .tip.on { opacity: 1; }

  /* ---------- data list ---------- */
  .rows { border-top: 1px solid var(--rule); }
  .row {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 2px; border-bottom: 1px solid var(--rule);
    font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12.5px;
  }
  .row .stamp { color: var(--ink-2); width: 108px; flex: none; }
  .row .free { font-weight: 600; width: 62px; flex: none; }
  .row .max { color: var(--ink-2); width: 46px; flex: none; }
  .row .tag {
    font-size: 10px; letter-spacing: .06em; text-transform: uppercase;
    color: var(--ink-3); border: 1px solid var(--edge);
    border-radius: 4px; padding: 1px 5px; flex: none;
  }
  .row .tag.onsite { color: var(--accent-ink); border-color: var(--accent); }
  .row .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); }
  .row .del {
    appearance: none; background: none; border: 0; cursor: pointer;
    color: var(--ink-3); font-size: 16px; line-height: 1; padding: 6px; flex: none;
  }
  .row .del:hover { color: var(--critical); }

  .todo { margin: 0; padding: 0; list-style: none; }
  .todo li {
    display: flex; gap: 10px; align-items: baseline;
    padding: 8px 0; border-bottom: 1px solid var(--rule);
    font-size: 13.5px;
  }
  .todo li:last-child { border-bottom: 0; }
  .todo .slot {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-weight: 600; width: 92px; flex: none;
  }
  .todo .why { color: var(--ink-2); font-size: 12.5px; }

  details { border-top: 1px solid var(--rule); padding-top: 12px; margin-top: 4px; }
  summary { cursor: pointer; font-size: 13px; font-weight: 600; color: var(--ink-2); }
  summary:hover { color: var(--ink); }
  details[open] summary { margin-bottom: 12px; }

  .setup-grid { display: grid; gap: 10px; }
  .setup-row {
    display: grid; grid-template-columns: 1fr 88px auto; gap: 8px; align-items: center;
  }
  .foot {
    font-size: 12px; color: var(--ink-3); text-align: center;
    padding: 8px 0 0; line-height: 1.6;
  }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
  @media (max-width: 420px) {
    .verdict .headline { font-size: 25px; }
    .row .stamp { width: 92px; }
    .row .grow { display: none; }
  }
</style>

<div class="wrap">
  <header class="masthead">
    <h1>Curb Log</h1>
    <span class="sub" id="mast-sub">street parking · 8a–8p</span>
  </header>

  <nav class="nav" role="tablist" aria-label="Views">
    <button role="tab" id="tab-log" aria-selected="true" data-view="log">Log</button>
    <button role="tab" id="tab-patterns" aria-selected="false" data-view="patterns">Patterns</button>
    <button role="tab" id="tab-data" aria-selected="false" data-view="data">Data</button>
  </nav>

  <div id="status-slot"></div>

  <main id="view"></main>

  <p class="foot" id="foot"></p>
</div>

<script>
(function () {
  "use strict";

  /* ============================ constants ============================ */

  var DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  var DOW_FULL = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  var MAX_CHIPS = [15, 30, 45, 60, 90, 120, 180, 240];
  var LS_OBS = "curblog.obs.v1";
  var LS_CFG = "curblog.cfg.v1";
  var LS_PENDING = "curblog.pending.v1";

  var DEFAULT_CFG = {
    blocks: [{ id: "b1", name: "Block A", capacity: 8 }],
    activeBlock: "b1",
    winStart: 8,
    winEnd: 20
  };

  /* ============================ state ============================ */

  var state = {
    view: "log",
    db: null,
    downloads: null,
    dbReady: false,
    cfg: null,
    obs: [],            // real observations (db + pending, deduped)
    pending: [],        // not yet written to the store
    demo: false,        // showing example data because the log is empty
    demoObs: [],
    draft: { blockId: null, free: null, maxMin: null, onsite: false, note: "", when: null },
    lastSaved: null,
    gridMode: "free",   // free | max | coverage
    profileDow: "wk",   // "wk" = Mon-Fri pooled, or 0-6
    selectedCell: null,
    error: null
  };

  /* ============================ storage helpers ============================ */

  function lsGet(key, fallback) {
    try {
      var raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (e) { return fallback; }
  }
  function lsSet(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) { /* private mode */ }
  }

  /* ============================ time helpers ============================ */

  function hourLabel(h) {
    var suffix = h < 12 ? "a" : "p";
    var display = h % 12 === 0 ? 12 : h % 12;
    return display + suffix;
  }
  function clockLabel(d) {
    var h = d.getHours(), m = d.getMinutes();
    var suffix = h < 12 ? "am" : "pm";
    var display = h % 12 === 0 ? 12 : h % 12;
    return display + ":" + (m < 10 ? "0" : "") + m + suffix;
  }
  function stamp(ts) {
    var d = new Date(ts);
    return DOW[d.getDay()] + " " + (d.getMonth() + 1) + "/" + d.getDate() + " " + clockLabel(d);
  }
  function dateKey(ts) {
    var d = new Date(ts);
    var m = d.getMonth() + 1, day = d.getDate();
    return d.getFullYear() + "-" + (m < 10 ? "0" : "") + m + "-" + (day < 10 ? "0" : "") + day;
  }
  function localInputValue(ts) {
    var d = new Date(ts - d0offset(ts));
    return d.toISOString().slice(0, 16);
  }
  function d0offset(ts) { return new Date(ts).getTimezoneOffset() * 60000; }
  function durLabel(min) {
    if (min == null) return "—";
    if (min >= 60) {
      var h = Math.floor(min / 60), r = min % 60;
      return r === 0 ? h + "h" : h + "h" + r;
    }
    return min + "m";
  }

  function hoursInWindow() {
    var out = [];
    for (var h = state.cfg.winStart; h < state.cfg.winEnd; h++) out.push(h);
    return out;
  }

  /* ============================ demo data ============================ */

  // Deterministic pseudo-random so the example never flickers between renders.
  function seeded(seed) {
    var s = seed;
    return function () {
      s = (s * 1103515245 + 12345) % 2147483648;
      return s / 2147483648;
    };
  }

  function buildDemo() {
    var rnd = seeded(20260909);
    // A plausible campus block: open early, crushed 10a-2p, empties after 5p.
    var byHour = { 8: 6.5, 9: 4.2, 10: 2.0, 11: 1.1, 12: 0.9, 13: 1.4, 14: 2.1, 15: 3.2, 16: 4.4, 17: 5.8, 18: 7.2, 19: 7.8 };
    var dowMult = { 0: 1.9, 1: 1.0, 2: 0.75, 3: 1.0, 4: 0.75, 5: 1.35, 6: 1.8 };
    var out = [];
    var now = Date.now();
    var startDay = new Date(now);
    startDay.setHours(0, 0, 0, 0);
    startDay = startDay.getTime() - 13 * 86400000;

    for (var day = 0; day < 14; day++) {
      var base = startDay + day * 86400000;
      var dow = new Date(base).getDay();
      var checkHours = [8, 10, 12, 14, 17, 19];
      for (var i = 0; i < checkHours.length; i++) {
        if (rnd() < 0.18) continue;              // a few missed checks, like real life
        var h = checkHours[i];
        var minute = Math.floor(rnd() * 60);
        var ts = base + h * 3600000 + minute * 60000;
        if (ts > now) continue;
        var mean = byHour[h] * dowMult[dow];
        var free = Math.max(0, Math.round(mean + (rnd() - 0.5) * 2.2));
        free = Math.min(8, free);
        // Street cleaning Mon & Thu until 10a caps what you can buy.
        var maxMin = 240;
        if ((dow === 1 || dow === 4) && h < 10) maxMin = Math.max(15, (10 - h) * 60 - minute);
        out.push({
          id: "demo_" + day + "_" + i,
          ts: ts, blockId: "b1", free: free, maxMin: maxMin,
          onsite: rnd() < 0.15, note: ""
        });
      }
    }
    return out.sort(function (a, b) { return b.ts - a.ts; });
  }

  /* ============================ aggregation ============================ */

  function activeObs() {
    var src = state.demo ? state.demoObs : state.obs;
    var id = state.cfg.activeBlock;
    return src.filter(function (o) { return o.blockId === id; });
  }

  // key "dow-hour" -> { n, freeVals[], maxVals[], meanFree, medMax }
  function buildCells(list) {
    var cells = {};
    list.forEach(function (o) {
      var d = new Date(o.ts);
      var key = d.getDay() + "-" + d.getHours();
      if (!cells[key]) cells[key] = { n: 0, freeVals: [], maxVals: [] };
      cells[key].n++;
      cells[key].freeVals.push(o.free);
      if (o.maxMin != null) cells[key].maxVals.push(o.maxMin);
    });
    Object.keys(cells).forEach(function (k) {
      var c = cells[k];
      c.meanFree = c.freeVals.reduce(function (a, b) { return a + b; }, 0) / c.freeVals.length;
      c.medMax = c.maxVals.length ? median(c.maxVals) : null;
      c.minFree = Math.min.apply(null, c.freeVals);
      c.maxFree = Math.max.apply(null, c.freeVals);
    });
    return cells;
  }

  function median(arr) {
    var s = arr.slice().sort(function (a, b) { return a - b; });
    var m = Math.floor(s.length / 2);
    return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
  }

  function heatClass(meanFree) {
    var b = Math.min(5, Math.max(0, Math.round(meanFree)));
    return "h" + b;
  }
  function maxClass(medMax) {
    if (medMax >= 240) return "h5";
    if (medMax >= 180) return "h4";
    if (medMax >= 120) return "h3";
    if (medMax >= 90) return "h2";
    if (medMax >= 60) return "h1";
    return "h0";
  }
  function covClass(n) {
    if (n >= 4) return "c4";
    if (n === 3) return "c3";
    if (n === 2) return "c2";
    return "c1";
  }

  /* ============================ rendering: shell ============================ */

  function render() {
    document.querySelectorAll(".nav button").forEach(function (b) {
      b.setAttribute("aria-selected", b.dataset.view === state.view ? "true" : "false");
    });
    var block = currentBlock();
    document.getElementById("mast-sub").textContent =
      block.name.toLowerCase() + " · " + hourLabel(state.cfg.winStart) + "–" + hourLabel(state.cfg.winEnd);

    renderStatus();
    var host = document.getElementById("view");
    host.innerHTML = "";
    if (state.view === "log") host.appendChild(viewLog());
    else if (state.view === "patterns") host.appendChild(viewPatterns());
    else host.appendChild(viewData());

    var real = state.obs.length;
    document.getElementById("foot").textContent =
      real + (real === 1 ? " observation logged" : " observations logged") +
      (state.pending.length ? " · " + state.pending.length + " waiting to sync" : "");
  }

  function renderStatus() {
    var slot = document.getElementById("status-slot");
    slot.innerHTML = "";
    if (state.error) {
      slot.appendChild(banner("<strong>" + state.error + "</strong>"));
    }
    if (state.demo && state.view !== "log") {
      slot.appendChild(banner(
        "<strong>Example data.</strong> This is a made-up two weeks so you can see what the " +
        "analysis will look like. Your first real entry clears it."
      ));
    }
    if (!state.dbReady && !state.demo) {
      slot.appendChild(banner(
        "<strong>Saving to this device only.</strong> The shared store didn’t load, so entries " +
        "are kept in this browser and will sync when it does."
      ));
    }
  }

  function banner(html) {
    var el = document.createElement("div");
    el.className = "banner";
    el.innerHTML = '<span class="dot"></span><div>' + html + "</div>";

  }

  function currentBlock() {
    var b = state.cfg.blocks.filter(function (x) { return x.id === state.cfg.activeBlock; })[0];
    return b || state.cfg.blocks[0] || DEFAULT_CFG.blocks[0];
  }

  function el(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  }

    frag.appendChild(setupCard());

  function labelRow(name, aside) {
    var l = el("div", "label");
    l.appendChild(el("span", "name", name));
    if (aside) l.appendChild(el("span", "aside", aside));
    return l;
  }

  function setupCard() {
    var card = el("div", "card");
    var d = el("details");
    d.appendChild(el("summary", null, "Blocks & hours"));
    var body = el("div", "setup-grid");

    state.cfg.blocks.forEach(function (b) {
      var row = el("div", "setup-row");

      nm.onchange = function () { b.name = nm.value || b.name; saveCfg(); render(); };

        state.draft.blockId = state.cfg.activeBlock;

      };

    });

    add.onclick = function () {

      saveCfg(); render();

    ws.setAttribute("aria-label", "First hour");

    var we = el("input"); we.type = "number"; we.min = "1"; we.max = "24"; we.value = state.cfg.winEnd;
    we.setAttribute("aria-label", "Last hour");

    win.appendChild(ws); win.appendChild(we);

    d.appendChild(body);

  function clampHour(v, fallback) {
    var n = parseInt(v, 10);
    if (isNaN(n) || n < 0 || n > 24) return fallback;
    return n;
  }

  /* ============================ view: patterns ============================ */

  function viewPatterns() {
    var frag = document.createDocumentFragment();
    var list = activeObs();
    var cells = buildCells(list);

    frag.appendChild(verdictPanel(cells, list));
    frag.appendChild(statStrip(list, cells));
    frag.appendChild(gridCard(cells));
    frag.appendChild(profileCard(list));
    frag.appendChild(gapsCard(cells));
    return frag;
  }

  function verdictPanel(cells, list) {
    var v = el("div", "verdict");
    var now = new Date();
    var dow = now.getDay(), hr = now.getHours();

    v.appendChild(el("div", "when", DOW_FULL[dow] + " · " + clockLabel(now) + " · " + currentBlock().name));

    if (!list.length) {
      v.appendChild(el("div", "headline", "Nothing logged yet"));
      v.appendChild(el("div", "basis", "Log your first check and this panel starts telling you what to expect at this hour."));
      return v;
    }

    var direct = cells[dow + "-" + hr];
    var head, basis;

    if (direct && direct.n >= 1) {
      head = '<span class="num">' + fmt1(direct.meanFree) + "</span> spots free, typically";
      basis = "From " + direct.n + (direct.n === 1 ? " check" : " checks") + " on a " + DOW[dow] +
        " at " + hourLabel(hr) + " — you saw " + direct.freeVals.slice().sort(function (a, b) { return a - b; }).join(", ") + ".";
      if (direct.n < 3) basis += " Thin: treat it as a hint, not a forecast.";
    } else {
      // Widen: same weekday, hour ±1
      var near = [];
      [hr - 1, hr + 1].forEach(function (h) {
        var c = cells[dow + "-" + h];
        if (c) near.push(c);
      });
      if (near.length) {
        var n = near.reduce(function (a, c) { return a + c.n; }, 0);
        var mean = near.reduce(function (a, c) { return a + c.meanFree * c.n; }, 0) / n;
        head = '<span class="num">' + fmt1(mean) + "</span> spots free, roughly";
        basis = "No check logged for " + DOW[dow] + " at " + hourLabel(hr) +
          " yet — this borrows the hour either side (" + n + (n === 1 ? " check" : " checks") + "). Worth logging one now.";
      } else {
        // Widen again: same hour, any weekday
        var same = [], total = 0, sum = 0;
        for (var d = 0; d < 7; d++) {
          var c = cells[d + "-" + hr];
          if (c) { total += c.n; sum += c.meanFree * c.n; }
        }
        if (total) {
          head = '<span class="num">' + fmt1(sum / total) + "</span> spots free, across all days";
          basis = "Nothing yet for " + DOW_FULL[dow] + " at this hour, so this pools every weekday (" +
            total + " checks). A " + DOW[dow] + " check right now would be the most valuable one you can make.";
        } else {
          head = "No data for this hour";
          basis = hourLabel(hr) + " has never been checked on any day. Open the app and log one.";
        }
      }
    }

    v.appendChild(el("div", "headline", head));
    v.appendChild(el("div", "basis", basis));
    return v;
  }

  function fmt1(n) {
    return (Math.round(n * 10) / 10).toFixed(1).replace(/\.0$/, "");
  }

  function statStrip(list, cells) {
    var wrap = el("div", "stats");
    var days = {};
    list.forEach(function (o) { days[dateKey(o.ts)] = 1; });

    var anyFree = list.filter(function (o) { return o.free > 0; }).length;
    var pct = list.length ? Math.round(100 * anyFree / list.length) : 0;

    // Tightest and loosest hour, pooled across weekdays (Mon-Fri).
    var byHour = {};
    list.forEach(function (o) {
      var d = new Date(o.ts);
      if (d.getDay() === 0 || d.getDay() === 6) return;
      var h = d.getHours();
      if (!byHour[h]) byHour[h] = [];
      byHour[h].push(o.free);
    });
    var hoursRanked = Object.keys(byHour)
      .filter(function (h) { return byHour[h].length >= 2; })
      .map(function (h) {
        return { h: +h, mean: byHour[h].reduce(function (a, b) { return a + b; }, 0) / byHour[h].length };
      })
      .sort(function (a, b) { return a.mean - b.mean; });

    addStat(wrap, list.length, "checks logged");
    addStat(wrap, Object.keys(days).length, "days covered");
    addStat(wrap, pct + "%", "had a spot free");
    addStat(wrap,
      hoursRanked.length ? hourLabel(hoursRanked[0].h) : "—",
      hoursRanked.length ? "worst weekday hour" : "need 2+ per hour");
    addStat(wrap,
      hoursRanked.length ? hourLabel(hoursRanked[hoursRanked.length - 1].h) : "—",
      hoursRanked.length ? "best weekday hour" : "keep logging");

    var maxes = list.filter(function (o) { return o.maxMin != null; }).map(function (o) { return o.maxMin; });
    addStat(wrap, maxes.length ? durLabel(median(maxes)) : "—",
      maxes.length ? "typical max stay" : "no max-stay data");
    return wrap;
  }

  function addStat(wrap, value, key) {
    var s = el("div", "stat");
    s.appendChild(el("div", "v", String(value)));
    s.appendChild(el("div", "k", key));
    wrap.appendChild(s);
  }

  function gridCard(cells) {
    var card = el("div", "card");
    card.appendChild(el("h2", null, "Every hour of the week"));
    card.appendChild(el("p", "hint",
      "One square per weekday and hour. Tap a square to see the checks behind it."));

    var modes = el("div", "chips");
    modes.style.marginBottom = "14px";
    [["free", "Spots free"], ["max", "Max stay"], ["coverage", "Coverage"]].forEach(function (m) {
      var c = el("button", "chip wide", m[1]);
      c.setAttribute("aria-pressed", state.gridMode === m[0] ? "true" : "false");
      c.onclick = function () { state.gridMode = m[0]; state.selectedCell = null; render(); };
      modes.appendChild(c);
    });
    card.appendChild(modes);

    var hours = hoursInWindow();
    var scroll = el("div", "grid-scroll");
    var grid = el("div", "heat");
    grid.style.gridTemplateColumns = "40px repeat(" + hours.length + ", minmax(30px, 1fr))";

    grid.appendChild(el("div"));
    hours.forEach(function (h) { grid.appendChild(el("div", "hcol", hourLabel(h))); });

    var now = new Date();
    for (var d = 0; d < 7; d++) {
      grid.appendChild(el("div", "hrow", DOW[d]));
      for (var i = 0; i < hours.length; i++) {
        grid.appendChild(cellEl(cells, d, hours[i], now));

  function cellEl(cells, d, h, now) {
    var c = cells[d + "-" + h];
    var b;
    if (!c) {
      b = el("button", "cell empty", "·");
      b.disabled = true;
      b.setAttribute("aria-label", DOW_FULL[d] + " " + hourLabel(h) + ": no checks yet");
    } else {
      var cls, text, aria;
      if (state.gridMode === "free") {
        cls = heatClass(c.meanFree); text = fmt1(c.meanFree);
        aria = fmt1(c.meanFree) + " spots free on average, " + c.n + " checks";
      } else if (state.gridMode === "max") {
        if (c.medMax == null) { cls = ""; text = "–"; aria = "max stay not recorded"; }
        else { cls = maxClass(c.medMax); text = durLabel(c.medMax); aria = "max stay " + durLabel(c.medMax); }
      } else {
        cls = covClass(c.n); text = String(c.n);
        aria = c.n + (c.n === 1 ? " check" : " checks");
      }
      b = el("button", "cell " + cls, text);
      b.setAttribute("aria-label", DOW_FULL[d] + " " + hourLabel(h) + ": " + aria);
      b.title = DOW[d] + " " + hourLabel(h) + " — " + aria;
      b.onclick = function () { state.selectedCell = d + "-" + h; render(); };
    }
    if (d === now.getDay() && h === now.getHours()) b.classList.add("now");
    if (state.selectedCell === d + "-" + h) b.classList.add("now");
    return b;
  }

  function legendFor(mode) {
    var l = el("div", "legend");
    var sw = el("div", "swatches");
    var lo, hi;
    if (mode === "coverage") {
      ["c1", "c2", "c3", "c4"].forEach(function (c) {
        var s = el("div", "sw"); s.className = "sw cell " + c; s.style.height = "13px"; sw.appendChild(s);
      });
      lo = "1 check"; hi = "4+";
    } else {
      ["h0", "h1", "h2", "h3", "h4", "h5"].forEach(function (c) {
        var s = el("div", "sw"); s.className = "sw cell " + c; s.style.height = "13px"; sw.appendChild(s);
      });
      lo = mode === "max" ? "under 1h" : "0 free";
      hi = mode === "max" ? "4h cap" : "5+ free";
    }
    l.appendChild(el("span", null, lo));
    l.appendChild(sw);
    l.appendChild(el("span", null, hi));
    l.appendChild(el("span", null, "· dashed = never checked · ring = right now"));
    return l;
  }

  function cellDetail(cells) {
    var parts = state.selectedCell.split("-");
    var d = +parts[0], h = +parts[1];
    var c = cells[state.selectedCell];
    var box = el("div", "cell-detail");
    if (!c) { box.textContent = "No checks yet."; return box; }
    var sorted = c.freeVals.slice().sort(function (a, b) { return a - b; });
    box.innerHTML =
      "<strong>" + DOW_FULL[d] + ", " + hourLabel(h) + "</strong><br>" +
      '<span class="muted">spots free —</span> ' + sorted.join(", ") +
      "  <span class=\"muted\">(mean " + fmt1(c.meanFree) + ", range " + c.minFree + "–" + c.maxFree + ")</span><br>" +
      '<span class="muted">max stay —</span> ' + (c.medMax == null ? "not recorded" : "median " + durLabel(c.medMax)) +
      "<br><span class=\"muted\">based on " + c.n + (c.n === 1 ? " check" : " checks") + "</span>";
    return box;
  }

  /* ---------- hour profile chart ---------- */

  function profileCard(list) {
    var card = el("div", "card");
    var scopeName = state.profileDow === "wk" ? "Mon–Fri pooled" : DOW_FULL[+state.profileDow];
    card.appendChild(el("h2", null, "Through the day"));
    card.appendChild(el("p", "hint",
      "Average spots free by hour, with the full range you actually observed. A wide band " +
      "means the hour is unpredictable, not that it is busy. Dashed segments jump over hours " +
      "you never checked."));

    var chips = el("div", "chips");
    chips.style.marginBottom = "14px";
    var scopes = [["wk", "Mon–Fri"], ["1", "Mon"], ["2", "Tue"], ["3", "Wed"], ["4", "Thu"], ["5", "Fri"], ["6", "Sat"], ["0", "Sun"]];
    scopes.forEach(function (s) {
      var c = el("button", "chip wide", s[1]);
      c.setAttribute("aria-pressed", state.profileDow === s[0] ? "true" : "false");
      c.onclick = function () { state.profileDow = s[0]; render(); };
      chips.appendChild(c);
    });
    card.appendChild(chips);

    var scoped = list.filter(function (o) {
      var d = new Date(o.ts).getDay();
      return state.profileDow === "wk" ? (d >= 1 && d <= 5) : d === +state.profileDow;
    });
    card.appendChild(lineChart(scoped, scopeName));
    return card;
  }

  function lineChart(list, scopeName) {
    var hours = hoursInWindow();
    var byHour = {};
    list.forEach(function (o) {
      var h = new Date(o.ts).getHours();
      if (h < state.cfg.winStart || h >= state.cfg.winEnd) return;
      if (!byHour[h]) byHour[h] = [];
      byHour[h].push(o.free);
    });

    var pts = hours.map(function (h) {
      var v = byHour[h];
      if (!v || !v.length) return { h: h, n: 0 };
      return {
        h: h, n: v.length,
        mean: v.reduce(function (a, b) { return a + b; }, 0) / v.length,
        lo: Math.min.apply(null, v), hi: Math.max.apply(null, v)
      };
    });

    // Draw at roughly 1 unit = 1 CSS pixel so labels stay legible at every width.
    var W = Math.max(300, Math.min(760, window.innerWidth || 760) - 60);
    var H = 240, PL = 30, PR = 14, PT = 18, PB = 38;
    var FS = 11, labelStep = W < 430 ? 2 : 1;
    var cap = currentBlock().capacity || 8;
    var dataMax = pts.reduce(function (m, p) { return p.n ? Math.max(m, p.hi) : m; }, 0);
    var yMax = Math.max(2, Math.max(cap, dataMax));
    var plotW = W - PL - PR, plotH = H - PT - PB;

    function X(i) { return PL + (hours.length === 1 ? plotW / 2 : (i / (hours.length - 1)) * plotW); }
    function Y(v) { return PT + plotH - (v / yMax) * plotH; }

    var wrap = el("div", "chart-wrap");
    var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    svg.setAttribute("role", "img");
    svg.setAttribute("aria-label", "Average spots free by hour, " + scopeName);

    function add(tag, attrs, text) {
      var n = document.createElementNS("http://www.w3.org/2000/svg", tag);
      Object.keys(attrs).forEach(function (k) { n.setAttribute(k, attrs[k]); });
      if (text != null) n.textContent = text;
      svg.appendChild(n);
      return n;
    }

    // gridlines + y ticks
    var ticks = [0, Math.round(yMax / 2), yMax];
    ticks.forEach(function (t) {
      add("line", { x1: PL, x2: W - PR, y1: Y(t), y2: Y(t), stroke: "var(--rule)", "stroke-width": 1, fill: "none" });
      add("text", {
        x: PL - 7, y: Y(t) + 3.5, "text-anchor": "end", fill: "var(--ink-3)",
        "font-size": FS, "font-family": "IBM Plex Mono, monospace"
      }, String(t));
    });

    // x ticks — thinned on narrow screens so labels never collide
    hours.forEach(function (h, i) {
      if (i % labelStep !== 0 && i !== hours.length - 1) return;
      add("text", {
        x: X(i), y: H - 16, "text-anchor": "middle", fill: "var(--ink-3)",
        "font-size": FS, "font-family": "IBM Plex Mono, monospace"
      }, hourLabel(h));
    });
    add("text", {
      x: PL, y: H - 2, "text-anchor": "start", fill: "var(--ink-3)",
      "font-size": FS - 1, "font-family": "IBM Plex Mono, monospace"
    }, "spots free (y) · hour (x) · " + scopeName);

    var solid = [];
    pts.forEach(function (p, i) { if (p.n > 0) solid.push({ p: p, i: i }); });

    if (!solid.length) {
      add("text", {
        x: W / 2, y: PT + plotH / 2, "text-anchor": "middle", fill: "var(--ink-3)",
        "font-size": 14, "font-family": "Barlow, sans-serif"
      }, "No checks in this range yet");
      wrap.appendChild(svg);
      return wrap;
    }

    // An unchecked hour is a gap in sampling, not a zero — so the band and the
    // line span it. Segments that jump over unchecked hours are dashed.
    if (solid.length > 1) {
      var top = solid.map(function (o) { return X(o.i) + "," + Y(o.p.hi); });
      var bot = solid.slice().reverse().map(function (o) { return X(o.i) + "," + Y(o.p.lo); });
      add("polygon", {
        points: top.concat(bot).join(" "),
        fill: "var(--accent)", "fill-opacity": 0.14, stroke: "none"
      });
      for (var s = 1; s < solid.length; s++) {
        var a = solid[s - 1], b = solid[s];
        var seg = {
          x1: X(a.i), y1: Y(a.p.mean), x2: X(b.i), y2: Y(b.p.mean),
          stroke: "var(--accent)", "stroke-width": 2, "stroke-linecap": "round", fill: "none"
        };
        if (b.i - a.i > 1) seg["stroke-dasharray"] = "5 4";
        add("line", seg);
      }
    } else {
      var only = solid[0];
      add("line", {
        x1: X(only.i), y1: Y(only.p.lo), x2: X(only.i), y2: Y(only.p.hi),
        stroke: "var(--accent)", "stroke-width": 2, "stroke-opacity": 0.4,
        "stroke-linecap": "round", fill: "none"
      });
    }

    // markers, with a surface ring so overlaps stay readable
    solid.forEach(function (o) {
      add("circle", {
        cx: X(o.i), cy: Y(o.p.mean), r: 4.5,
        fill: "var(--accent)", stroke: "var(--surface)", "stroke-width": 2
      });
    });

    // direct-label only the extremes
    var lowest = solid.reduce(function (a, b) { return b.p.mean < a.p.mean ? b : a; });
    var highest = solid.reduce(function (a, b) { return b.p.mean > a.p.mean ? b : a; });
    [[lowest, "tightest"], [highest, "easiest"]].forEach(function (pair) {
      var o = pair[0];
      if (lowest === highest && pair[1] === "easiest") return;
      var above = o === highest;
      add("text", {
        x: Math.min(W - PR - 30, Math.max(PL + 28, X(o.i))),
        y: above ? Y(o.p.mean) - 12 : Y(o.p.mean) + 20,
        "text-anchor": "middle", fill: "var(--ink-2)",
        "font-size": FS + 0.5, "font-weight": 600, "font-family": "Barlow, sans-serif"
      }, pair[1] + " " + hourLabel(o.p.h));
    });

    wrap.appendChild(svg);

    // hover / touch crosshair
    var tip = el("div", "tip");
    wrap.appendChild(tip);
    var cross = add("line", {
      x1: 0, x2: 0, y1: PT, y2: PT + plotH, stroke: "var(--ink-3)",
      "stroke-width": 1, "stroke-dasharray": "3 3", opacity: 0, fill: "none"
    });

    function move(ev) {
      var rect = svg.getBoundingClientRect();
      var cx = ((ev.touches ? ev.touches[0].clientX : ev.clientX) - rect.left) / rect.width * W;
      var idx = Math.round((cx - PL) / (plotW || 1) * (hours.length - 1));
      idx = Math.max(0, Math.min(hours.length - 1, idx));
      var p = pts[idx];
      cross.setAttribute("x1", X(idx)); cross.setAttribute("x2", X(idx));
      cross.setAttribute("opacity", 1);
      tip.classList.add("on");
      tip.style.left = (X(idx) / W * 100) + "%";
      tip.style.top = (p.n ? (Y(p.mean) / H * 100) : 50) + "%";
      tip.innerHTML = p.n
        ? "<strong>" + hourLabel(p.h) + "</strong> · " + fmt1(p.mean) + " free<br>" +
          "range " + p.lo + "–" + p.hi + " · " + p.n + (p.n === 1 ? " check" : " checks")
        : "<strong>" + hourLabel(p.h) + "</strong> · no checks";
    }
    function leave() { cross.setAttribute("opacity", 0); tip.classList.remove("on"); }
    svg.addEventListener("pointermove", move);
    svg.addEventListener("pointerleave", leave);
    svg.addEventListener("touchmove", function (e) { move(e); e.preventDefault(); }, { passive: false });
    svg.addEventListener("touchend", leave);

    return wrap;
  }

  /* ---------- gaps ---------- */

  function gapsCard(cells) {
    var card = el("div", "card");
    card.appendChild(el("h2", null, "Where the data is thin"));
    card.appendChild(el("p", "hint",
      "Two weeks gives you two of each weekday, so a single square is never much evidence. " +
      "These are the next checks that would buy you the most."));

    var now = new Date();
    var picks = [];
    for (var i = 1; i <= 72; i++) {
      var t = new Date(now.getTime() + i * 3600000);
      var h = t.getHours();
      if (h < state.cfg.winStart || h >= state.cfg.winEnd) continue;
      var key = t.getDay() + "-" + h;
      var c = cells[key];
      picks.push({ key: key, when: t, n: c ? c.n : 0, in: i });
    }
    var seen = {};
    picks = picks.filter(function (p) {
      if (seen[p.key]) return false;
      seen[p.key] = 1; return true;
    }).sort(function (a, b) {
      if (a.n !== b.n) return a.n - b.n;
      return a.in - b.in;
    }).slice(0, 5);

    var ul = el("ul", "todo");
    picks.forEach(function (p) {
      var li = el("li");
      li.appendChild(el("span", "slot", DOW[p.when.getDay()] + " " + hourLabel(p.when.getHours())));
      li.appendChild(el("span", "why",
        p.n === 0 ? "never checked" :
        p.n === 1 ? "1 check so far — a second one makes it comparable" :
        p.n + " checks so far"));
      ul.appendChild(li);
    });
    card.appendChild(ul);
    return card;
  }

  /* ============================ view: data ============================ */

  function viewData() {
    var frag = document.createDocumentFragment();
    var card = el("div", "card");
    card.appendChild(el("h2", null, "Every check"));

    var list = (state.demo ? state.demoObs : state.obs).slice()
      .sort(function (a, b) { return b.ts - a.ts; });

    if (!list.length) {
      card.appendChild(el("p", "hint", "Nothing logged yet. Your entries will show up here, newest first."));
      frag.appendChild(card);
      return frag;
    }

    card.appendChild(el("p", "hint",
      list.length + " checks across " + state.cfg.blocks.length +
      (state.cfg.blocks.length === 1 ? " block." : " blocks.") +
      (state.demo ? " (Example data — not yours, and not exportable.)" : "")));

    var rows = el("div", "rows");
    list.slice(0, 300).forEach(function (o) {
      var r = el("div", "row");
      var blk = state.cfg.blocks.filter(function (b) { return b.id === o.blockId; })[0];
      r.appendChild(el("span", "stamp", stamp(o.ts)));
      r.appendChild(el("span", "free", o.free + " free"));
      r.appendChild(el("span", "max", durLabel(o.maxMin)));
      var tag = el("span", "tag" + (o.onsite ? " onsite" : ""), o.onsite ? "eyes" : "app");
      r.appendChild(tag);
      r.appendChild(el("span", "grow", (blk ? blk.name : o.blockId) + (o.note ? " · " + o.note : "")));
      if (!state.demo) {
        var del = el("button", "del", "×");
        del.setAttribute("aria-label", "Delete check from " + stamp(o.ts));
        del.onclick = function () { removeObs(o.id); render(); };
        r.appendChild(del);
      }
      rows.appendChild(r);
    });
    card.appendChild(rows);
    frag.appendChild(card);

    if (!state.demo) {
      var ex = el("div", "card");
      ex.appendChild(el("h2", null, "Take the data with you"));
      ex.appendChild(el("p", "hint",
        "One row per check, with weekday and hour already split out — drops straight into R or pandas."));
      var br = el("div", "btn-row");
      var dl = el("button", "btn secondary small", "Download CSV");
      dl.onclick = downloadCsv;
      var cp = el("button", "btn secondary small", "Copy CSV");
      cp.onclick = function () {
        navigator.clipboard.writeText(buildCsv()).then(function () {
          cp.textContent = "Copied";
          setTimeout(function () { cp.textContent = "Copy CSV"; }, 1600);
        }, function () { cp.textContent = "Copy failed"; });
      };
      br.appendChild(dl); br.appendChild(cp);
      ex.appendChild(br);
      frag.appendChild(ex);
    }
    return frag;
  }

  function buildCsv() {
    var head = "timestamp,date,weekday,hour,minute,block,spots_free,block_capacity,max_payable_min,source,note";
    var lines = state.obs.slice().sort(function (a, b) { return a.ts - b.ts; }).map(function (o) {
      var d = new Date(o.ts);
      var blk = state.cfg.blocks.filter(function (b) { return b.id === o.blockId; })[0];
      return [
        new Date(o.ts - d0offset(o.ts)).toISOString().slice(0, 19),
        dateKey(o.ts), DOW[d.getDay()], d.getHours(), d.getMinutes(),
        csvCell(blk ? blk.name : o.blockId), o.free, blk ? blk.capacity : "",
        o.maxMin == null ? "" : o.maxMin,
        o.onsite ? "onsite" : "app",
        csvCell(o.note || "")
      ].join(",");
    });
    return head + "\n" + lines.join("\n") + "\n";
  }
  function csvCell(s) {
    s = String(s);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }

  function downloadCsv() {
    var csv = buildCsv();
    if (state.downloads) {
      state.downloads.save({ filename: "curb-log.csv", data: csv }).catch(function (err) {
        if (err && err.code === "declined") return;
        state.error = "Download didn’t go through (" + ((err && err.code) || "unknown") + "). Use Copy CSV instead.";
        render();
      });
    } else {
      navigator.clipboard.writeText(csv).then(function () {
        state.error = null;
        alert("Downloads aren’t available here, so the CSV is on your clipboard instead.");
      });
    }
  }

  /* ============================ writes ============================ */

  function saveDraft() {
    if (state.draft.free == null) return;
    var ts = state.draft.when || Date.now();
    var obs = {
      id: "o_" + ts + "_" + Math.random().toString(36).slice(2, 7),
      ts: ts,
      blockId: state.draft.blockId || currentBlock().id,
      free: state.draft.free,
      maxMin: state.draft.maxMin,
      onsite: state.draft.onsite,
      note: state.draft.note.trim()
    };
    state.obs.push(obs);
    state.demo = false;
    state.lastSaved = obs;
    state.draft = { blockId: obs.blockId, free: null, maxMin: null, onsite: false, note: "", when: null };
    cacheObs();
    queueWrite(obs);
    render();
  }

  function removeObs(id) {
    state.obs = state.obs.filter(function (o) { return o.id !== id; });
    state.pending = state.pending.filter(function (o) { return o.id !== id; });
    lsSet(LS_PENDING, state.pending);
    cacheObs();
    if (state.db) {
      state.db.doc("observations/" + id).delete().catch(function () { /* already gone */ });
    }
    if (!state.obs.length) state.demo = true;
  }

  function queueWrite(obs) {
    state.pending.push(obs);
    lsSet(LS_PENDING, state.pending);
    flushPending();
  }

  function flushPending() {
    if (!state.db || !state.pending.length) return;
    var batch = state.pending.slice();
    batch.forEach(function (o) {
      state.db.doc("observations/" + o.id).set({
        ts: o.ts, blockId: o.blockId, free: o.free,
        maxMin: o.maxMin, onsite: o.onsite, note: o.note
      }).then(function () {
        state.pending = state.pending.filter(function (p) { return p.id !== o.id; });
        lsSet(LS_PENDING, state.pending);
        render();
      }).catch(function (err) {
        if (err && (err.code === "invalid_argument" || err.code === "quota_exceeded")) {
          state.pending = state.pending.filter(function (p) { return p.id !== o.id; });
          lsSet(LS_PENDING, state.pending);
          state.error = err.code === "quota_exceeded"
            ? "The store is full — export your CSV and delete some old checks."
            : "One entry couldn’t be saved to the shared store; it’s still on this device.";
          render();
        }
        // transient: leave it queued, next flush retries
      });
    });
  }

  function cacheObs() { lsSet(LS_OBS, state.obs.slice(-2000)); }

  function saveCfg() {
    lsSet(LS_CFG, state.cfg);
    if (state.db) state.db.doc("config/settings").set(state.cfg).catch(function () { });
  }

  /* ============================ boot ============================ */

  function mergeObs(fromDb) {
    var seen = {};
    var out = [];
    fromDb.concat(state.pending).forEach(function (o) {
      if (seen[o.id]) return;
      seen[o.id] = 1;
      out.push(o);
    });
    return out.sort(function (a, b) { return a.ts - b.ts; });
  }

  function init() {
    state.cfg = lsGet(LS_CFG, null) || JSON.parse(JSON.stringify(DEFAULT_CFG));
    if (!state.cfg.blocks || !state.cfg.blocks.length) state.cfg.blocks = JSON.parse(JSON.stringify(DEFAULT_CFG.blocks));
    state.pending = lsGet(LS_PENDING, []);
    state.obs = mergeObs(lsGet(LS_OBS, []));
    state.demoObs = buildDemo();
    state.demo = state.obs.length === 0;
    state.draft.blockId = currentBlock().id;

    document.querySelectorAll(".nav button").forEach(function (b) {
      b.onclick = function () { state.view = b.dataset.view; state.selectedCell = null; render(); };
    });

    render();

    if (window.claude && typeof window.claude.use === "function") {
      window.claude.use("db").then(function (db) {
        if (!db) { render(); return; }
        state.db = db;
        state.dbReady = true;

        db.doc("config/settings").get().then(function (snap) {
          if (snap.exists) {
            var c = snap.data();
            if (c && c.blocks && c.blocks.length) {
              state.cfg = c;
              lsSet(LS_CFG, c);
              if (!currentBlock()) state.cfg.activeBlock = state.cfg.blocks[0].id;
              state.draft.blockId = currentBlock().id;
              render();
            }
          } else {
            db.doc("config/settings").set(state.cfg).catch(function () { });
          }
        }).catch(function () { });

        db.collection("observations").orderBy("ts", "desc").limit(1000)
          .onSnapshot(function (snap) {
            var rows = snap.docs.map(function (d) {
              var v = d.data();
              return {
                id: d.id, ts: v.ts, blockId: v.blockId, free: v.free,
                maxMin: v.maxMin == null ? null : v.maxMin,
                onsite: !!v.onsite, note: v.note || ""
              };
            });
            state.obs = mergeObs(rows);
            state.demo = state.obs.length === 0;
            cacheObs();
            render();
          }, function (err) {
            state.dbReady = false;
            state.error = err && err.code === "revoked"
              ? "Lost access to the shared store. Entries are being kept on this device."
              : null;
            render();
          });

        flushPending();
        render();
      }).catch(function () { render(); });

      window.claude.use("downloads").then(function (d) { state.downloads = d; }).catch(function () { });
    }

    // Retry queued writes when the network comes back.
    window.addEventListener("online", flushPending);

    // Charts are drawn at pixel scale, so re-draw when the width really changes.
    var lastW = window.innerWidth, resizeTimer = null;
    window.addEventListener("resize", function () {
      if (Math.abs(window.innerWidth - lastW) < 24) return;
      lastW = window.innerWidth;
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(render, 120);
    });
  }

  init();
})();
</script>
